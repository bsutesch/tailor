}

// ─── JOB VS MARKET COMPARISON (deterministic — no AI) ───────────────────────
// Takes AI-extracted job dimensions and computes every verdict in plain JS.
// The extraction (reading free text) is AI's job; the comparison math is not.
function compareJobToMarket(jobDims, intel) {
  if (!jobDims || !intel) return null;

  const tierKey = jobDims.location_tier && LOCATION_TIERS[jobDims.location_tier]
    ? jobDims.location_tier
    : "mid_metro";
  const tier = LOCATION_TIERS[tierKey];
  const resolved = resolveSeniorityKey(jobDims.seniority, intel.salaryRanges);
  const seniority = resolved.key;
  const baseRange = intel.salaryRanges[seniority];
  const adjustedRange = baseRange
    ? [Math.round(baseRange[0] * tier.multiplier), Math.round(baseRange[1] * tier.multiplier)]
    : null;

  // ── Salary verdict ──
  let salary = null;
  if (adjustedRange) {
    if (jobDims.salary_listed && (jobDims.salary_min || jobDims.salary_max)) {
      const jMin = jobDims.salary_min || jobDims.salary_max;
      const jMax = jobDims.salary_max || jobDims.salary_min;
      const jobMid = (jMin + jMax) / 2;
      const marketMid = (adjustedRange[0] + adjustedRange[1]) / 2;
      const pctDiff = Math.round(((jobMid - marketMid) / marketMid) * 100);
      let verdict, detail;
      if (jobMid < adjustedRange[0] * 0.92) {
        verdict = "below";
        detail = "This posting's range runs " + Math.abs(pctDiff) + "% below the typical range for a " + seniority + " " + intel.label + " role in this location tier.";
      } else if (jobMid > adjustedRange[1] * 1.08) {
        verdict = "above";
        detail = "This posting's range runs " + Math.abs(pctDiff) + "% above the typical range for a " + seniority + " " + intel.label + " role in this location tier.";
      } else {
        verdict = "competitive";
        detail = "This posting's range lines up with the typical market for a " + seniority + " " + intel.label + " role in this location tier.";
      }
      salary = { verdict, detail, jobRange: [jMin, jMax], marketRange: adjustedRange, pctDiff };
    } else {
      salary = {
        verdict: "unlisted",
        detail: "No salary range was found in the posting. For a " + seniority + " " + intel.label + " role in this location tier, the market typically pays $" +
          Math.round(adjustedRange[0] / 1000) + "K\u2013$" + Math.round(adjustedRange[1] / 1000) + "K.",
        jobRange: null,
        marketRange: adjustedRange,
        pctDiff: null,
      };
    }
  }

  // ── Experience-requirement verdict ──
  let experience = null;
  const typicalYears = TYPICAL_YEARS_BY_SENIORITY[seniority];
  if (typicalYears && typeof jobDims.years_required === "number") {
    const [lo, hi] = typicalYears;
    let verdict, detail;
    if (jobDims.years_required > hi + 2) {
      verdict = "high";
      detail = "Asking for " + jobDims.years_required + " years is well above the " + lo + "\u2013" + hi + " years typical for a " + seniority + " title \u2014 this may be a " + seniority + " title with more senior expectations, or a leveling mismatch.";
    } else if (jobDims.years_required < lo && jobDims.years_required >= 0) {
      verdict = "low";
      detail = jobDims.years_required + " years is below the usual " + lo + "\u2013" + hi + " years for a " + seniority + " title \u2014 the role may be scoped more junior than its title suggests.";
    } else {
      verdict = "typical";
      detail = jobDims.years_required + " years falls within the usual " + lo + "\u2013" + hi + " year range for a " + seniority + " title.";
    }
    experience = { verdict, detail, required: jobDims.years_required, typicalRange: typicalYears };
  }

  // ── Requirements-breadth verdict ──
  let breadth = null;
  const methodCount = (jobDims.required_methods || []).length;
  if (methodCount > 0) {
    const [lo, hi] = TYPICAL_METHOD_COUNT_RANGE;
    let verdict, detail;
    if (methodCount > hi) {
      verdict = "demanding";
      detail = "This posting names " + methodCount + " distinct methods or tools as requirements, more than the " + lo + "\u2013" + hi + " a typical posting lists. That can mean a genuinely broad role, or a wish-list job description.";
    } else if (methodCount < lo) {
      verdict = "narrow";
      detail = "This posting names only " + methodCount + " specific method or tool, fewer than most postings. The role may be flexible on background, or the posting may be light on detail.";
    } else {
      verdict = "typical";
      detail = "This posting names " + methodCount + " methods or tools, in line with a typical posting.";
    }
    breadth = { verdict, detail, count: methodCount, typicalRange: TYPICAL_METHOD_COUNT_RANGE };
  }

  return {
    seniority, tierKey, tierLabel: tier.label, salary, experience, breadth,
    seniorityNote: resolved.substituted
      ? "This posting reads as \"" + (resolved.from || "an unrecognized level") + ",\" which " + intel.label + " market data doesn't track separately. Showing the closest tracked level, " + seniority + ", instead."
      : null,
  };
}

// ─── PROFILE HELPERS ────────────────────────────────────────────────────────
// Deterministic overlap between the applicant's items and a market list. No AI.
// Returns every market item annotated with whether the applicant has it, plus
// matched/missing splits for counts.
function coverage(applicantItems, marketList) {
  const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const have = new Set((applicantItems || []).map(norm).filter(Boolean));
  const items = (marketList || []).map(m => {
    const parts = m.name.toLowerCase().split(" / ").map(norm);
    const hit = parts.some(p => {
      for (const h of have) {
        if (h.includes(p) || p.includes(h)) return true;
      }
      return false;
    });
    return { ...m, hit };
  });
  return {
    items,
    matched: items.filter(i => i.hit),
    missing: items.filter(i => !i.hit),
  };
}

            <span style={{

              fontWeight: it.hit ? 500 : 400,
            }}>
              {it.name}
            </span>

            <div style={{ width: 70, height: 5, background: T.bgInput, borderRadius: 3, overflow: "hidden", flexShrink: 0 }}>

                      {skillCov.matched.length}/{intel.topSoftSkills.length}
                    </div>
                    <div style={{ fontSize: 10, color: T.textMuted, marginTop: 2 }}>Soft skills</div>
                  </div>
                )}

                    </div>
                    <div style={{ fontSize: 10, color: T.textMuted, marginTop: 2 }}>Tools</div>

                  <div style={{ fontSize: 10, color: T.textMuted, marginTop: 2 }}>AI exp ({intel.aiMentionRate}% ask)</div>

              </div>

                  <div style={{ fontSize: 13, color: T.textBright }}>

                {signalCov && (
                  <div style={{ background: T.bgSubtle, borderRadius: 8, padding: "12px 14px" }}>

                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                      {intel.emergingSignals.map((sig, i) => {
                        const hit = signalCov.items[i] && signalCov.items[i].hit;
                        return (
                          <span key={i} style={{
                            padding: "3px 8px", fontSize: 11, borderRadius: 5,
                            background: hit ? T.accentSoft : T.bgInput,
                            color: hit ? T.accentInk : T.textDim,

                <CoverageList title="Most-requested methods" items={methodCov.items} T={T} />
              </div>

                <div style={{ marginBottom: 20 }}>

function UploadZone({ accept, label, hint, fileName, onFile, onClear, extracting, error, T }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  const handleFile = (file) => { if (file) onFile(file); };
  const handleDrop = (e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); };

  if (fileName) {
    return (
      <div style={{
        display: "flex", alignItems: "center", gap: 10,
        background: T.accentSoft, border: "1px solid " + T.accent + "33",
        borderRadius: 8, padding: "10px 14px",
      }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.accentInk} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <span style={{ flex: 1, fontSize: 13, color: T.accentInk, fontWeight: 500 }}>{fileName}</span>
        <button onClick={onClear} style={{
          background: "none", border: "none", color: T.textMuted, cursor: "pointer",
          fontSize: 16, fontFamily: T.font, padding: "0 4px",
        }}>{"\u00D7"}</button>
      </div>
    );
  }

  return (
    <div>
      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        onClick={() => inputRef.current?.click()}
        style={{
          border: "2px dashed " + (dragOver ? T.accent : T.borderStrong),
          borderRadius: 10, padding: "32px 20px", textAlign: "center",
          cursor: "pointer", transition: "border-color 0.15s, background 0.15s",
          background: dragOver ? T.accentSoft : T.bgSubtle,
        }}
      >
        <input
          ref={inputRef} type="file" accept={accept}
          style={{ display: "none" }}
          onChange={(e) => handleFile(e.target.files[0])}
        />
        {extracting ? (
          <div style={{ fontSize: 13, color: T.textMuted }}>Reading file...</div>
        ) : (
          <div>
            <div style={{ fontSize: 13, color: T.textBright, fontWeight: 500, marginBottom: 4 }}>{label}</div>
            <div style={{ fontSize: 12, color: T.textMuted }}>{hint}</div>
          </div>
        )}
      </div>
      {error && <div style={{ fontSize: 12, color: T.danger, marginTop: 6 }}>{error}</div>}
    </div>
  );
}

// ─── SAVED JOBS / TRACKER (Part 3A) — localStorage, no backend ─────────────
const SAVED_JOBS_KEY = "tailor_saved_jobs";
const JOB_STATUSES = ["saved", "applied", "interviewing", "offered", "rejected", "withdrawn"];
const JOB_STATUS_LABELS = { saved: "Saved", applied: "Applied", interviewing: "Interviewing", offered: "Offered", rejected: "Rejected", withdrawn: "Withdrawn" };

function loadSavedJobs() {
  try {
    const raw = localStorage.getItem(SAVED_JOBS_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}
function persistSavedJobs(jobs) {
  try { localStorage.setItem(SAVED_JOBS_KEY, JSON.stringify(jobs)); } catch (e) { /* storage unavailable or full — silently skip */ }
}

function jobStatusColor(status, T) {
  return ({
    saved: T.textMuted, applied: T.accentInk, interviewing: T.warning,
    offered: T.success, rejected: T.danger, withdrawn: T.textDim,
  })[status] || T.textMuted;
}

function StatusBadge({ status, T }) {
  return (
    <span style={{
      display: "inline-block", padding: "3px 9px", borderRadius: 6,
      fontSize: 10, fontWeight: 700, color: "#fff", background: jobStatusColor(status, T),
      textTransform: "uppercase", letterSpacing: "0.03em", whiteSpace: "nowrap",
    }}>
      {JOB_STATUS_LABELS[status] || status}
    </span>
  );
}

// ─── SEARCH STRATEGY ANALYTICS (Part 2E) — deterministic, from saved jobs ───
function TargetingInsights({ jobs, applicantSeniority, intel, T }) {
  const total = jobs.length;
  const cautionCount = jobs.filter(j => j.postingQualityVerdict === "Proceed with caution").length;
  const highReqCount = jobs.filter(j => j.aboveP75Requirements).length;
  const belowMarketCount = jobs.filter(j => j.salaryVerdict === "below").length;

  const senCounts = {};
  jobs.forEach(j => { if (j.seniority) senCounts[j.seniority] = (senCounts[j.seniority] || 0) + 1; });
  const senLevels = Object.keys(senCounts).sort((a, b) => senCounts[b] - senCounts[a]);

  const funnel = { saved: 0, applied: 0, interviewing: 0, offered: 0, rejected: 0, withdrawn: 0 };
  jobs.forEach(j => { funnel[j.status] = (funnel[j.status] || 0) + 1; });

  return (
    <div>
      {intel && <Provenance intel={intel} T={T} style={{ marginBottom: 12 }} />}
      <SectionLabel T={T}>Targeting profile</SectionLabel>
      <Card T={T} style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: T.textBright, lineHeight: 1.65, marginBottom: cautionCount / total > 0.4 ? 8 : 0 }}>
          {cautionCount} of {total} saved postings scored "Proceed with caution" on posting quality.
          {highReqCount > 0 && " " + highReqCount + " of " + total + " ask for more than typical for their level."}
          {belowMarketCount > 0 && " " + belowMarketCount + " of " + total + " pay below market for their level."}
        </div>
        {cautionCount / total > 0.4 && (
          <div style={{ fontSize: 12, color: T.warning, lineHeight: 1.5 }}>
            If response rates are low, your targeting may be harder than the market average — not your materials.
          </div>
        )}
      </Card>

      <SectionLabel T={T}>Level consistency</SectionLabel>
      <Card T={T} style={{ marginBottom: 16, padding: "16px 18px" }}>
        {senLevels.length === 0 ? (
          <div style={{ fontSize: 13, color: T.textMuted }}>No seniority data captured on your saved jobs yet.</div>
        ) : (
          <div>
            {senLevels.map(s => (
              <BarStat key={s} label={s} pct={Math.round((senCounts[s] / total) * 100)} highlight={s === applicantSeniority} T={T} />
            ))}
            {applicantSeniority && (
              <div style={{ fontSize: 12, color: T.textMuted, marginTop: 8 }}>
                Your profile reads as {applicantSeniority}-level (highlighted above). A saved-jobs mix skewed well above or below this may mean you're targeting the wrong level.
              </div>
            )}
          </div>
        )}
      </Card>

      <SectionLabel T={T}>Status funnel</SectionLabel>
      <Card T={T}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
          {JOB_STATUSES.map(s => (
            <div key={s} style={{ textAlign: "center", background: T.bgSubtle, borderRadius: 8, padding: "10px 6px" }}>
              <div style={{ fontSize: 18, fontWeight: 700, color: T.textBright }}>{funnel[s] || 0}</div>
              <div style={{ fontSize: 10, color: T.textMuted, marginTop: 2 }}>{JOB_STATUS_LABELS[s]}</div>
            </div>
          ))}
        </div>
      </Card>
      <div style={{ fontSize: 10.5, color: T.textDim, marginTop: 8 }}>
        Deterministic — computed from your saved jobs and each posting's quality verdict, captured at the time you saved it.
      </div>
    </div>
  );
}

                    <div style={{ fontSize: 12, color: T.textMuted, marginTop: 2 }}>
                      {job.company || "Unknown company"}{job.seniority ? " · " + job.seniority : ""}
                    </div>
                    <div style={{ fontSize: 11, color: T.textDim, marginTop: 4 }}>
                      Saved {new Date(job.dateAdded).toLocaleDateString()}
                      {job.dateApplied && " · Applied " + new Date(job.dateApplied).toLocaleDateString()}
                      {job.postingQualityVerdict && " · " + job.postingQualityVerdict}
                    </div>
                    {job.provenanceSnapshot && (

                        {job.provenanceSnapshot.live
                          ? "Meridian · " + (job.provenanceSnapshot.postingCount != null ? job.provenanceSnapshot.postingCount + " postings" : "live") + " at save time"

                      onClick={e => e.stopPropagation()}

                        fontFamily: T.font, fontSize: 11, padding: "3px 6px", borderRadius: 6,
                        border: "1px solid " + T.borderStrong, background: T.bgInput, color: T.textBright,
                      }}
                    >
                      {JOB_STATUSES.map(s => <option key={s} value={s}>{JOB_STATUS_LABELS[s]}</option>)}

                      </div>

            ))}

        {view === "insights" && <TargetingInsights jobs={jobs} applicantSeniority={applicantSeniority} intel={intel} T={T} />}

// ─── PERSISTENT STEP NAVIGATION ─────────────────────────────────────────────
// Shown at the top of every screen (setup steps, main input, and results) so
// the user always knows where they are and can jump back to re-edit their
// resume or voice profile without hunting for Settings. Uses the same
// max-width container as the body below it so the page never reflows when
// moving between setup and the main app.
function StepNav({ setupStep, resumeText, resumeFileName, voiceText, voiceFileName, onGoTo, T }) {
  const steps = [
    { key: "resume", n: 1, label: "Add resume", loaded: !!resumeText, detail: resumeFileName || null },
    { key: "voice", n: 2, label: "Voice profile", loaded: !!voiceText, detail: voiceText ? (voiceFileName || "Voice profile loaded") : null },
    { key: "ready", n: 3, label: "Tailor", loaded: false, detail: null },
  ];
  const activeIdx = steps.findIndex(s => s.key === setupStep);

  return (
    <div style={{ maxWidth: 960, margin: "0 auto", padding: "16px 24px 0" }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 0, marginBottom: 8 }}>
        {steps.map((s, i) => {
          const active = i === activeIdx;
          const done = s.loaded && !active;
          // Can't jump ahead of a resume — voice and the main app both need it first.
          const clickable = s.key === "resume" || !!resumeText;
          return (
            <div key={s.key} style={{ display: "flex", alignItems: "flex-start", flex: i < steps.length - 1 ? 1 : "none" }}>
              <button
                onClick={() => clickable && onGoTo(s.key)}
                disabled={!clickable}
                title={clickable ? "Go to " + s.label : "Add your resume first"}
                style={{
                  display: "flex", alignItems: "center", gap: 8,
                  background: "none", border: "none", padding: 0, marginTop: 2,
                  cursor: clickable ? "pointer" : "default",
                  opacity: clickable ? 1 : 0.5,
                  fontFamily: T.font, textAlign: "left",
                }}
              >
                <span style={{
                  width: 28, height: 28, borderRadius: "50%", flexShrink: 0,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 12, fontWeight: 700,
                  background: done ? T.success : active ? T.accent : T.bgInput,
                  color: done || active ? "#fff" : T.textMuted,
                  border: "1px solid " + (done ? T.success : active ? T.accent : T.borderStrong),
                }}>
                  {done ? "✓" : s.n}
                </span>
                <span style={{ display: "flex", flexDirection: "column" }}>
                  <span style={{
                    fontSize: 12, fontWeight: active ? 600 : 400,
                    color: active ? T.textBright : T.textMuted, whiteSpace: "nowrap",
                  }}>
                    {s.label}
                  </span>
                  {s.detail && (
                    <span style={{
                      fontSize: 10.5, color: T.textDim, whiteSpace: "nowrap",
                      maxWidth: 170, overflow: "hidden", textOverflow: "ellipsis",
                    }}>
                      {s.detail}
                    </span>
                  )}
                </span>
              </button>
              {i < steps.length - 1 && (
                <div style={{
                  flex: 1, height: 1, margin: "16px 12px 0",
                  background: s.loaded ? T.success : T.borderStrong,
                }} />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MAIN ───────────────────────────────────────────────────────────────────
function Tailor() {
  const [theme, setTheme] = useState("light");
  // Setup wizard: "resume" → "voice" → "ready"
  // Once ready, main flow: "input" → "loading" → "results"
  const [setupStep, setSetupStep] = useState("resume");
  const [step, setStep] = useState("input");

  // Uploaded files
  const [resumeFileName, setResumeFileName] = useState("");
  const [resumeText, setResumeText] = useState("");
  const [voiceFileName, setVoiceFileName] = useState("");
  const [voiceText, setVoiceText] = useState("");
  const [extracting, setExtracting] = useState(false);
  const [fileError, setFileError] = useState(null);

  // Resume profile (extracted across Meridian dimensions)
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(false);
  const [profileError, setProfileError] = useState(null);

  // Voice profile writing-style summary
  const [voiceSummary, setVoiceSummary] = useState(null);
  const [voiceLoading, setVoiceLoading] = useState(false);
  const [voiceError, setVoiceError] = useState(null);

  // Job posting dimensions, extracted from the pasted job description so it

  // ── Live market data (Part 1) ──

  const [marketByDiscipline, setMarketByDiscipline] = useState({});

  // ── Intersectional rarity hook (Part 2D) ──
  // Once the top 2-3 differentiators for this posting are known, ask
  // /api/rarity what share of the corpus asks for all of them together. A
  // rare-enough combination becomes a Strategy-tab hook. Silently skipped on

  const [rarityHook, setRarityHook] = useState(null);
  const rarityRequestRef = useRef("");
  useEffect(() => {

    const requestKey = discipline + "|" + skills.join("|");

    rarityRequestRef.current = requestKey;
    setRarityHook(null);
    fetch("/api/rarity", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ discipline, skills }),
    })
      .then(r => { if (!r.ok) throw new Error("rarity fetch failed"); return r.json(); })
      .then(data => {
        if (data && typeof data.pctRequiringAll === "number" && data.pctRequiringAll <= 15) {
          setRarityHook({
            theme: "A rare intersection",
            insight: "The combination of " + skills.join(" + ") + " appears together in only " + data.pctRequiringAll + "% of " + (getIntel(discipline)?.label || "") + " postings — and this one wants all of them. You're in a rare intersection. Make it the spine of your positioning.",
          });

  useEffect(() => {

  // ── Extract resume profile across Meridian dimensions ──
  const analyzeResume = useCallback(async (text) => {

    const build = function(excerpt) {
      return "Read this resume. Reply with a JSON object only, no other text. " +
        "Keys: discipline (uxr or design or pm), seniority, seniority_rationale, " +
        "years_experience, methods (array), tools (array), soft_skills (array), " +
        "degree_level, degree_field, ai_experience (bool), ai_context, " +
        "industries (array), specializations (array), summary, " +
        "responsibilities (array of 5-8 stated outcomes/duties from the experience section, in the resume's own words), " +
        "impact_indicators (array of quantified achievements found in the resume, e.g. '40% increase in adoption', 'led a team of 6' — empty array if none).\n\n" + excerpt;
    };

      const controller = new AbortController();

      let lastErr = null;

      for (const budget of budgets) {
        try {
          const rawText = await callClaude(build(full.slice(0, budget)), controller.signal);
          parsed = parseModelJson(rawText);
          if (parsed) break;
          lastErr = new Error("Could not read the profile from the response.");
        } catch (e) {
          if (e.name === "AbortError") throw e;
          lastErr = e;
          const msg = e.message || "";
          if (msg.indexOf("Empty body") === -1 && msg.indexOf("no text") === -1 && msg.indexOf("read response") === -1) throw e;

      }

      setProfileError("Profile analysis failed \u2014 " + detail);
    } finally {
      setProfileLoading(false);
    }
  }, []);

  // ── Summarize writing style from the voice profile ──

  // ── Extract structured dimensions from the job posting itself ──
  // AI reads the free text; every comparison against market data afterward is
  // computed in compareJobToMarket, not by the model.
  const extractJobDimensions = useCallback(async (text) => {
    setJobDimsLoading(true);
    setJobDimsError(null);
    const full = sanitizeText(text);

    const build = (budget) =>
      "Read this job posting and reply with a JSON object only, no other text. Keys: " +
      "seniority (one of Intern, Entry, Mid, Senior, Lead, Staff, Principal, Manager, Director, VP, Head), " +
      "location_tier (one of major_metro, mid_metro, remote, lower_cost \u2014 major_metro for SF/NYC/Seattle/Boston/etc, remote if the posting says remote with no major-metro anchor, lower_cost for smaller or lower cost-of-living cities, mid_metro otherwise), " +
      "salary_listed (bool, true only if the posting states an actual number or range), " +
      "salary_min (number or null), salary_max (number or null), " +
      "years_required (number \u2014 the minimum years of experience explicitly required, best estimate), " +
      "required_methods (array of specific methods or tools explicitly required, not nice-to-haves), " +
      "required_skills (array of specific soft skills or qualities explicitly required, not nice-to-haves), " +
      "responsibilities (array of 3-8 verb-first duties this posting states, in its own words), " +
      "posting_title (the job title as stated, or null), " +
      "company (the company or organization name as stated, or null), " +
      "mission (one sentence describing the company's mission or what it does, only if the posting states it, or null), " +
      "degree_required (bool), remote_allowed (bool).\n\n" + excerptLabel(budget) + "\n\n" + full.slice(0, budget);

    // Small helper text so the model knows this may be a partial excerpt.
    function excerptLabel(n) { return n < full.length ? "(excerpt)" : ""; }

    try {
      const controller = new AbortController();
      let parsed = null;
      let lastErr = null;
      for (const budget of [2500]) {
        try {
          const rawText = await callClaude(build(budget), controller.signal);
          parsed = parseModelJson(rawText);
          if (parsed) break;
          lastErr = new Error("Could not read the job details from the response.");
        } catch (e) {
          if (e.name === "AbortError") throw e;
          lastErr = e;
          const msg = e.message || "";
          if (msg.indexOf("Empty body") === -1 && msg.indexOf("no text") === -1) throw e;
        }
      }
      if (!parsed) throw (lastErr || new Error("Could not analyze the posting."));

      // Merge deterministic salary extraction (runs on the FULL text, so it
      // catches salary ranges that appear at the bottom of long postings,
      // which the truncated AI excerpt misses).
      const detectedSalary = extractSalaryFromText(text);
      if (detectedSalary) {
        parsed.salary_listed = true;
        parsed.salary_min = detectedSalary.min;
        parsed.salary_max = detectedSalary.max;
      }

      setJobDims(parsed);
    } catch (err) {
      if (err.name === "AbortError") return;
      setJobDimsError(err.message || "Could not analyze the posting.");
    } finally {
      setJobDimsLoading(false);
    }
  }, []);

  useEffect(() => {

    if (jobText === lastAnalyzedJobRef.current) return;
    const t = setTimeout(() => {
      lastAnalyzedJobRef.current = jobText;
      extractJobDimensions(jobText);
    }, 1500);
    return () => clearTimeout(t);
  }, [jobText, extractJobDimensions]);

  // ── File handling ──

      setFileError(e.message || "Could not read file.");
      setExtracting(false);

  const clearResume = () => {

    setResumeFileName("");

    setProfileError(null);

    setVoiceFileName("");

  // ── Analysis ──
  const analyze = useCallback(async () => {
    if (!jobText.trim() || !resumeText.trim()) return;
    setStep("loading");
    setError(null);
    setResults(null);

    const intel = getIntel(discipline);
    const salaryRange = intel.salaryRanges[seniority];

    const fullJob = sanitizeText(jobText);
    const fullResume = sanitizeText(resumeText);
    const cleanVoice = sanitizeText(voiceText).slice(0, 800);

    const marketLine = "MARKET CONTEXT FOR " + intel.label.toUpperCase() + " (" + seniority + " level): Top methods: " + intel.topMethods.slice(0, 5).map(m => m.name + " (" + m.pct + "%)").join(", ") + ". Top soft skills: " + intel.topSoftSkills.slice(0, 4).map(s => s.name + " (" + s.pct + "%)").join(", ") + ". " + intel.aiMentionRate + "% of postings mention AI.";

    let voiceInstructions = "";
    if (cleanVoice) {
      voiceInstructions = "\n\nVOICE PROFILE (match this writing style in the cover letter without mentioning it):\n" + cleanVoice;
    }

    let profileInstructions = "";
    if (profile) {
      profileInstructions = "\n\nAPPLICANT PROFILE: " + sanitizeText(JSON.stringify({
        seniority: profile.seniority,
        years_experience: profile.years_experience,
        methods: (profile.methods || []).slice(0, 8),
        tools: (profile.tools || []).slice(0, 8),
        specializations: (profile.specializations || []).slice(0, 4),
      })).slice(0, 700);
    }

    // Pass the deterministic ATS findings so suggestions address real parsing
    // gaps rather than the model guessing at them.
    let atsInstructions = "";
    if (atsResult) {
      const issues = atsResult.checks
        .filter(c => c.status !== "pass")
        .map(c => c.label + ": " + c.detail)
        .join("; ");
      if (issues) {
        atsInstructions = "\n\nATS ISSUES DETECTED (address the relevant ones in your suggestions): " +
          sanitizeText(issues).slice(0, 600);
      }
    }

    // max_tokens is fixed at 1000 by the platform, so the work is split into two
    // smaller calls rather than one large one that would truncate.
    const budgets = [3500];

    const runWithFallback = async (buildPrompt, controller) => {
      let lastErr = null;
      // Two passes: the model sometimes returns unparseable output once, then
      // clean JSON on a fresh attempt.
      for (let pass = 0; pass < 2; pass++) {
        for (const budget of budgets) {
          try {
            const raw = await callClaude(buildPrompt(budget), controller.signal);
            const parsed = parseModelJson(raw);
            if (parsed) return parsed;
            lastErr = new Error("could not read the response");
          } catch (e) {
            if (e.name === "AbortError") throw e;
            lastErr = e;
            const msg = e.message || "";
            if (msg.indexOf("Empty body") === -1 && msg.indexOf("no text") === -1) throw e;
          }
        }
      }
      throw (lastErr || new Error("Something went wrong."));
    };

    try {
      const controller = new AbortController();
      abortRef.current = controller;

      // Call 1: positioning strength only (one sentence, small).
      const posPart = await runWithFallback((budget) =>
        "You are an expert career advisor. Identify the applicant's single strongest positioning angle for this specific role.\n\n" +
        "Respond with ONLY a JSON object, no other text, with key: position_strength (one sentence describing their best angle for this posting, referencing a specific strength from their resume and a specific requirement from the posting).\n\n" +
        marketLine + profileInstructions +
        "\n\nJOB DESCRIPTION:\n" + fullJob.slice(0, budget) +
        "\n\nAPPLICANT RESUME:\n" + fullResume.slice(0, budget)
      , controller);

      // Call 2: resume suggestions only (kept to 3 so the response fits).
      const suggestPart = await runWithFallback((budget) =>
        "You are an expert career advisor. Suggest the 3 highest-impact resume improvements for this application.\n\n" +
        "Respond with ONLY a JSON object, no other text, with key: suggestions (array of exactly 3 objects, each with area (short name), gap (what is missing, or null), suggestion (one sentence), wording (the exact text to add, first person, one to two sentences), location (where it goes, e.g. Summary, Experience, Skills)).\n\n" +
        marketLine + profileInstructions + atsInstructions +
        "\n\nJOB DESCRIPTION:\n" + fullJob.slice(0, budget) +
        "\n\nAPPLICANT RESUME:\n" + fullResume.slice(0, budget)
      , controller);

      // Call 3: interview talking points (small, so it always fits).
      const talkPart = await runWithFallback((budget) =>
        "You are an expert career advisor. Give 5 interview talking points for this application.\n\n" +
        "Respond with ONLY a JSON object, no other text, with key: talking_points (array of 5 short strings, each one sentence).\n\n" +
        marketLine + profileInstructions +
        "\n\nJOB DESCRIPTION:\n" + fullJob.slice(0, Math.min(budget, 2500)) +
        "\n\nAPPLICANT RESUME:\n" + fullResume.slice(0, Math.min(budget, 2500))
      , controller);

      setResults({
        cover_letter: "",
        position_strength: posPart.position_strength || "",
        suggestions: suggestPart.suggestions || [],
        talking_points: talkPart.talking_points || [],
      });
      setStep("results");
      setActiveTab("strategy");
    } catch (err) {
      if (err.name === "AbortError") return;
      const msg = err.message || "";
      if (msg.indexOf("Empty body") !== -1 || msg.indexOf("no text") !== -1 || msg.indexOf("could not read") !== -1) {
        setError("The AI service is not responding reliably in this preview environment. The ATS assessment and your uploaded documents are still ready. To generate a cover letter and resume suggestions, deploy Tailor to your own server where API calls run reliably.");
      } else {
        setError(msg || "Something went wrong.");
      }
      setStep("input");
    }
  }, [jobText, resumeText, voiceText, discipline, seniority, profile, atsResult, getIntel]);

  // ── Generate cover letter on demand (not automatically) ──
  const [coverGenerating, setCoverGenerating] = useState(false);
  const generateCoverLetter = useCallback(async () => {
    setCoverGenerating(true);
    setError(null);

    const cleanVoice = sanitizeText(voiceText).slice(0, 800);
    let voiceInstr = "";
    if (cleanVoice) {
      voiceInstr = "\n\nMatch this writing style without mentioning it:\n" + cleanVoice;
    }

    const fullJob = sanitizeText(jobText);
    const fullResume = sanitizeText(resumeText);

    try {
      const controller = new AbortController();
      abortRef.current = controller;
      const budgets = [3500];
      let parsed = null;
      let lastErr = null;
      for (const budget of budgets) {
        try {
          const raw = await callClaude(
            "You are an expert career advisor. Write a tailored cover letter.\n\n" +
            "Respond with ONLY a JSON object, no other text, with key: cover_letter (about 250 words, professional and specific, referencing real experience from the resume and real requirements from the posting).\n\n" +
            voiceInstr +
            "\n\nJOB DESCRIPTION:\n" + fullJob.slice(0, budget) +
            "\n\nAPPLICANT RESUME:\n" + fullResume.slice(0, budget),
            controller.signal
          );
          parsed = parseModelJson(raw);
          if (parsed) break;
          lastErr = new Error("Could not read the cover letter.");
        } catch (e) {
          if (e.name === "AbortError") throw e;
          lastErr = e;
        }
      }
      if (parsed && parsed.cover_letter) {
        setResults(r => ({ ...r, cover_letter: parsed.cover_letter }));
      } else {
        setError((lastErr && lastErr.message) || "Could not generate cover letter.");
      }
    } catch (err) {
      if (err.name === "AbortError") return;
      setError(err.message || "Could not generate cover letter.");
    } finally {
      setCoverGenerating(false);
    }
  }, [jobText, resumeText, voiceText]);

  // ── Regenerate cover letter with edit instructions ──
  const regenerateCoverLetter = useCallback(async (editRequest, onDone) => {
    if (!results?.cover_letter || !editRequest.trim()) return;
    setRegenerating(true);
    setError(null);

    const cleanVoice = sanitizeText(voiceText).slice(0, 2000);
    let voiceLine = "";
    if (cleanVoice) {
      voiceLine = "\n\nMatch this writing style without mentioning it:\n" + cleanVoice;
    }

    const prompt = "You are a career advisor. Revise the cover letter below based on the requested changes. Keep it professional and specific. Respond ONLY with the revised cover letter text, no preamble, no quotes, no markdown." + voiceLine + "\n\nREQUESTED CHANGES:\n" + sanitizeText(editRequest) + "\n\nCURRENT COVER LETTER:\n" + sanitizeText(results.cover_letter);

    try {
      const controller = new AbortController();
      abortRef.current = controller;
      const rawText = await callClaude(prompt, controller.signal);
      const revised = rawText.trim();
      if (!revised) throw new Error("Empty response. Try again.");
      setResults(r => ({ ...r, cover_letter: revised }));
      if (onDone) onDone();
    } catch (err) {
      if (err.name === "AbortError") return;
      setError(err.message || "Could not regenerate. Try again.");
    } finally {
      setRegenerating(false);
    }
  }, [results, voiceText]);

  // ── Reword a single resume suggestion ──
  const rewordSuggestion = useCallback(async (idx, rewordRequest, onDone) => {
    if (!results?.suggestions?.[idx] || !rewordRequest.trim()) return;
    setRewordingIdx(idx);
    setError(null);

    const s = results.suggestions[idx];
    const prompt = "You are a career advisor. Revise the resume suggestion wording below based on the requested change. Respond ONLY with a JSON object (no markdown) with keys: wording (the revised resume text in first person), suggestion (updated one-line rationale). Keep it concise.\n\nREQUESTED CHANGE:\n" + sanitizeText(rewordRequest) + "\n\nCURRENT WORDING:\n" + sanitizeText(s.wording || s.suggestion) + "\n\nCONTEXT (area): " + sanitizeText(s.area || "");

    try {
      const controller = new AbortController();
      abortRef.current = controller;
      const rawText = await callClaude(prompt, controller.signal);
      // If it didn't return JSON, treat the whole response as the new wording.
      const parsed = parseModelJson(rawText) || { wording: rawText.trim() };
      setResults(r => {
        const next = { ...r, suggestions: r.suggestions.slice() };
        next.suggestions[idx] = {
          ...next.suggestions[idx],
          wording: parsed.wording || next.suggestions[idx].wording,
          suggestion: parsed.suggestion || next.suggestions[idx].suggestion,
        };
        return next;
      });
      if (onDone) onDone();
    } catch (err) {
      if (err.name === "AbortError") return;
      setError(err.message || "Could not reword. Try again.");
    } finally {
      setRewordingIdx(null);
    }
  }, [results]);

  const reset = () => {
    if (abortRef.current) abortRef.current.abort();
    setStep("input");
    setResults(null);
    setError(null);
  };

  const canAnalyze = jobText.trim().length > 50 && resumeText.trim().length > 50;

  // Jump between setup steps and the main app from the persistent nav.
  // setupStep drives which screen renders; `step` (input/loading/results) is
  // untouched, so returning to "ready" lands back wherever the user left off.
  const goToSetupStep = (key) => setSetupStep(key);

  return (
    <div style={{
      minHeight: "100vh", background: T.bg, color: T.text,
      fontFamily: T.font, fontSize: 14, lineHeight: 1.55,
      WebkitFontSmoothing: "antialiased",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

      {/* ── HEADER ──────────────────────────────────────────────────── */}
      <div style={{
        background: T.bgCard, borderBottom: "1px solid " + T.border,
        padding: "10px 20px", display: "flex", alignItems: "center",
        gap: 10, flexWrap: "wrap",
      }}>
        {/* App icon */}
        <div style={{
          width: 32, height: 32, borderRadius: 8, flexShrink: 0,
          background: "linear-gradient(135deg, " + T.accent + ", " + T.accentInk + ")",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="6" cy="6" r="3" />
            <circle cx="6" cy="18" r="3" />
            <line x1="20" y1="4" x2="8.12" y2="15.88" />
            <line x1="14.47" y1="14.48" x2="20" y2="20" />
            <line x1="8.12" y1="8.12" x2="12" y2="12" />
          </svg>
        </div>

        <span style={{ fontSize: 16, fontWeight: 700, color: T.textBright, letterSpacing: "-0.02em" }}>
          Tailor
        </span>

        <button
          onClick={() => setShowAbout(true)}
          style={{
            background: T.accent, color: "#fff", border: "none", borderRadius: 14,
            padding: "4px 12px", fontSize: 11, fontWeight: 600, cursor: "pointer",
            fontFamily: T.font, whiteSpace: "nowrap",
          }}
        >
          What does this tool do?
        </button>

        {/* Nav items — only show when ready */}
        {isReady && step === "results" && (
          <div style={{ display: "flex", gap: 0, marginLeft: 4 }}>
            {[
              { id: "strategy", label: "Strategy" },
              { id: "cover", label: "Cover Letter" },
              { id: "resume", label: "Resume" },
              { id: "market", label: "Market Intel" },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                style={{
                  padding: "6px 14px", fontSize: 13, fontFamily: T.font, border: "none",
                  background: "transparent", cursor: "pointer",
                  color: activeTab === tab.id ? T.accentInk : T.textMuted,
                  fontWeight: activeTab === tab.id ? 600 : 400,
                }}
              >
                {tab.label}
              </button>
            ))}
          </div>
        )}

        {/* Right side */}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          {/* Theme toggle — Ledger pattern */}
          <button
            onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
            title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
            style={{
              display: "flex", alignItems: "center", gap: 9,
              background: "transparent", border: "none", cursor: "pointer",
              padding: "4px 2px", fontFamily: T.font,
            }}
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
              stroke={T.textMuted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
              style={{ display: "block", flex: "0 0 auto" }}>
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <span style={{
              position: "relative", width: 40, height: 22, borderRadius: 11,
              background: theme === "dark" ? T.accentInk : T.bgInput,
              border: "1px solid " + T.border, transition: "background .15s",
              flex: "0 0 auto", display: "inline-block",
            }}>
              <span style={{
                position: "absolute", top: 2,
                left: theme === "dark" ? 19 : 2,
                width: 16, height: 16, borderRadius: "50%",
                background: theme === "dark" ? "#fff" : T.textBright,
                transition: "left .15s",
              }} />
            </span>
            <span style={{ fontSize: 13, fontWeight: 600, color: T.textSecondary }}>
              Dark mode
            </span>
          </button>

          {/* Saved jobs / tracker */}
          {!!resumeText && (
            <button
              onClick={() => setShowSavedJobs(true)}
              style={{
                fontFamily: T.font, fontSize: 12, fontWeight: 600, cursor: "pointer",
                color: T.textMuted, background: "transparent", display: "flex", alignItems: "center", gap: 6,
                border: "1px solid " + T.border, padding: "5px 10px", borderRadius: 7,
              }}
            >
              Saved jobs
              {savedJobs.length > 0 && (
                <span style={{
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  minWidth: 16, height: 16, borderRadius: 8, padding: "0 4px",
                  background: T.accent, color: "#fff", fontSize: 10, fontWeight: 700,
                }}>
                  {savedJobs.length}
                </span>
              )}
            </button>
          )}

          {/* Save this job */}
          {isReady && step === "results" && (
            <button
              onClick={saveCurrentJob}
              disabled={currentJobSaved}
              style={{
                fontFamily: T.font, fontSize: 12, fontWeight: 600,
                cursor: currentJobSaved ? "default" : "pointer",
                color: currentJobSaved ? T.success : T.textMuted, background: "transparent",
                border: "1px solid " + (currentJobSaved ? T.success + "55" : T.border), padding: "5px 10px", borderRadius: 7,
              }}
            >
              {currentJobSaved ? "✓ Saved" : "Save this job"}
            </button>
          )}

          {/* Settings */}
          {!!resumeText && (
            <button
              onClick={() => setShowSettings(true)}
              style={{
                fontFamily: T.font, fontSize: 12, fontWeight: 600, cursor: "pointer",
                color: T.textMuted, background: "transparent",
                border: "1px solid " + T.border, padding: "5px 10px", borderRadius: 7,
              }}
            >
              Settings
            </button>
          )}

          {/* New analysis */}
          {isReady && step === "results" && (
            <button
              onClick={reset}
              style={{
                fontFamily: T.font, fontSize: 12, fontWeight: 600, cursor: "pointer",
                color: T.textMuted, background: "transparent",
                border: "1px solid " + T.border, padding: "5px 10px", borderRadius: 7,
              }}
            >
              New analysis
            </button>
          )}
        </div>
      </div>

      {/* ── STEP NAVIGATION (persists across every screen) ─────────────── */}
      <StepNav
        setupStep={setupStep}
        resumeText={resumeText}
        resumeFileName={resumeFileName}
        voiceText={voiceText}
        voiceFileName={voiceFileName}
        onGoTo={goToSetupStep}
        T={T}
      />

      {/* ── ABOUT MODAL ─────────────────────────────────────────────── */}
      {showAbout && (
        <div style={{
          position: "fixed", inset: 0, zIndex: 999,
          background: "rgba(0,0,0,0.45)", display: "flex",
          alignItems: "center", justifyContent: "center",
        }} onClick={() => setShowAbout(false)}>
          <div style={{
            background: T.bgCard, borderRadius: 12, padding: "28px 32px",
            maxWidth: 520, width: "90%", boxShadow: T.shadowHover,
            border: "1px solid " + T.border,
          }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.textBright, marginBottom: 12 }}>
              Tailor
            </div>
            <div style={{ fontSize: 13, color: T.text, lineHeight: 1.7 }}>
              Tailor helps job applicants position their experience for specific roles. Paste a job description and your resume, and Tailor will generate a tailored cover letter, resume optimization suggestions, and interview talking points.
            </div>
            <div style={{ fontSize: 13, color: T.text, lineHeight: 1.7, marginTop: 12 }}>
              What makes it different is the market intelligence layer. Tailor draws on data from Meridian, which tracks thousands of active job postings across UX Research, UX Design, and Product Management. It knows which methods, skills, and signals employers actually ask for at each seniority level, and uses that context to shape your application.
            </div>
            <div style={{ marginTop: 20, textAlign: "right" }}>
              <Btn primary onClick={() => setShowAbout(false)} T={T}>Got it</Btn>
            </div>
          </div>
        </div>
      )}

      {/* ── SAVED JOBS MODAL ────────────────────────────────────────── */}
      {showSavedJobs && (
        <SavedJobsPanel
          jobs={savedJobs}
          applicantSeniority={profile && profile.seniority}
          intel={getIntel(discipline)}
          onClose={() => setShowSavedJobs(false)}
          onRestore={restoreJob}
          onDelete={deleteJob}
          onStatusChange={updateJobStatus}
          T={T}
        />
      )}

      {/* ── SETTINGS MODAL ──────────────────────────────────────────── */}
      {showSettings && (
        <div style={{
          position: "fixed", inset: 0, zIndex: 999,
          background: "rgba(0,0,0,0.45)", display: "flex",
          alignItems: "center", justifyContent: "center",
        }} onClick={() => setShowSettings(false)}>
          <div style={{
            background: T.bgCard, borderRadius: 12, padding: "28px 32px",
            maxWidth: 480, width: "90%", boxShadow: T.shadowHover,
            border: "1px solid " + T.border,
          }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.textBright, marginBottom: 20 }}>
              Settings
            </div>

            <div style={{ marginBottom: 20 }}>
              <SectionLabel T={T}>Resume</SectionLabel>
              <UploadZone
                accept=".docx,.pdf"
                label="Upload resume"
                hint=".docx or .pdf"
                fileName={resumeFileName}
                onFile={handleResumeFile}
                onClear={clearResume}
                extracting={extracting}
                error={null}
                T={T}
              />
              {resumeText && (
                <div style={{ fontSize: 11, color: T.textDim, marginTop: 4 }}>
                  {resumeText.split(/\s+/).filter(Boolean).length} words extracted
                  {profileLoading && " \u00B7 analyzing profile..."}
                  {profile && !profileLoading && " \u00B7 profile ready"}
                </div>
              )}
            </div>

            <div style={{ marginBottom: 20 }}>
              <SectionLabel T={T}>Voice profile</SectionLabel>
              <UploadZone
                accept=".docx,.md,.txt"
                label="Upload voice profile"
                hint=".docx or .md"
                fileName={voiceFileName}
                onFile={handleVoiceFile}
                onClear={clearVoice}
                extracting={extracting}
                error={null}
                T={T}
              />
              {voiceText && (
                <div style={{ fontSize: 11, color: T.textDim, marginTop: 4 }}>
                  {voiceText.split(/\s+/).filter(Boolean).length} words extracted
                  {voiceLoading && " \u00B7 summarizing style..."}
                  {voiceSummary && !voiceLoading && " \u00B7 style captured"}
                </div>
              )}
              {!voiceFileName && (
                <div style={{ fontSize: 11, color: T.textDim, marginTop: 4 }}>
                  Optional. When provided, the cover letter will match this writing style.
                </div>
              )}
            </div>

            <div style={{ textAlign: "right" }}>
              <Btn primary onClick={() => setShowSettings(false)} T={T}>Done</Btn>
            </div>
          </div>
        </div>
      )}

      {/* ── BODY ────────────────────────────────────────────────────── */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "24px 24px" }}>

        {/* ── SETUP WIZARD ────────────────────────────────────────── */}
        {/* No inner max-width here — same container as the main app below,
            so the page does not reflow when setupStep reaches "ready". */}
        {!isReady && (
          <div>

            {/* Step 1: Resume */}
            {setupStep === "resume" && (
              <div>
                <Card T={T} style={{ marginBottom: profile || profileLoading || profileError ? 16 : 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
                    <div style={{ fontSize: 15, fontWeight: 600, color: T.textBright }}>
                      Add your resume
                    </div>
                    <button
                      onClick={() => { setResumePasteMode(m => !m); setFileError(null); }}
                      style={{
                        background: "none", border: "none", color: T.accentInk, cursor: "pointer",
                        fontSize: 12, fontWeight: 600, fontFamily: T.font,
                      }}
                    >
                      {resumePasteMode ? "Upload a file instead" : "Paste text instead"}
                    </button>
                  </div>
                  <div style={{ fontSize: 13, color: T.textMuted, marginBottom: 16, lineHeight: 1.6 }}>
                    Your resume is the persistent base document — upload it once and it stays loaded across every posting you analyze. Tailor reads it and assesses it across the same dimensions the market tracks. This stays local and is only used to generate tailored application materials.
                  </div>

                  {resumePasteMode ? (
                    <div>
                      <TextArea
                        value={resumePaste}
                        onChange={setResumePaste}
                        T={T}
                        rows={12}
                        placeholder={"Paste your resume text here.\n\nInclude your roles, skills, methods, tools, education, and notable projects or outcomes."}
                      />
                      {fileError && <div style={{ fontSize: 12, color: T.danger, marginTop: 6 }}>{fileError}</div>}
                      <div style={{ marginTop: 12 }}>
                        <Btn primary onClick={submitResumePaste} disabled={profileLoading || resumePaste.trim().length < 20} T={T}>
                          {profileLoading ? "Analyzing..." : "Use this resume"}
                        </Btn>
                      </div>
                    </div>
                  ) : (
                    <UploadZone
                      accept=".docx,.pdf"
                      label="Drop your resume here, or click to browse"
                      hint="Accepts .docx and .pdf"
                      fileName={resumeFileName}
                      onFile={handleResumeFile}
                      onClear={clearResume}
                      extracting={extracting}
                      error={fileError}
                      T={T}
                    />
                  )}
                </Card>

                {/* ATS readiness — deterministic, shown as soon as text exists */}
                {atsResult && (
                  <AtsReport result={atsResult} T={T} />
                )}

                {/* AI profile — appears when it arrives, doesn't block anything */}
                {(profile || profileLoading || profileError) && (
                  <ResumeProfile
                    profile={profile}
                    loading={profileLoading}
                    error={profileError}
                    discipline={discipline}
                    getIntel={getIntel}
                    T={T}
                    collapsedByDefault={false}
                  />
                )}

                {/* Advance as soon as resume text exists */}
                {resumeText && (
                  <div style={{ textAlign: "right" }}>
                    <Btn primary onClick={() => setSetupStep("voice")} T={T}>
                      Continue to voice profile {"\u2192"}
                    </Btn>
                  </div>
                )}
              </div>
            )}

            {/* Step 2: Voice profile */}
            {setupStep === "voice" && (
              <div>
                <Card T={T} style={{ marginBottom: voiceSummary || voiceLoading || voiceError ? 16 : 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
                    <div style={{ fontSize: 15, fontWeight: 600, color: T.textBright }}>
                      Add a voice profile
                    </div>
                    <button
                      onClick={() => { setVoicePasteMode(m => !m); setFileError(null); }}
                      style={{
                        background: "none", border: "none", color: T.accentInk, cursor: "pointer",
                        fontSize: 12, fontWeight: 600, fontFamily: T.font,
                      }}
                    >
                      {voicePasteMode ? "Upload a file instead" : "Paste text instead"}
                    </button>
                  </div>
                  <div style={{ fontSize: 13, color: T.textMuted, marginBottom: 16, lineHeight: 1.6 }}>
                    A voice profile describes your writing style, tone, and preferences. Like your resume, it stays loaded across every posting you analyze and shapes the writing guidance you get — not just a generated draft. You can skip this and add one later in Settings.
                  </div>

                  {voicePasteMode ? (
                    <div>
                      <TextArea
                        value={voicePaste}
                        onChange={setVoicePaste}
                        T={T}
                        rows={10}
                        placeholder={"Paste your voice profile, or a few paragraphs of your own writing that show your style."}
                      />
                      {fileError && <div style={{ fontSize: 12, color: T.danger, marginTop: 6 }}>{fileError}</div>}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
                        <button
                          onClick={skipVoice}
                          style={{
                            background: "none", border: "none", color: T.textMuted, cursor: "pointer",
                            fontSize: 13, fontFamily: T.font, textDecoration: "underline",
                          }}
                        >
                          Skip for now
                        </button>
                        <Btn primary onClick={submitVoicePaste} disabled={voiceLoading || voicePaste.trim().length < 10} T={T}>
                          {voiceLoading ? "Analyzing..." : "Use this profile"}
                        </Btn>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <UploadZone
                        accept=".docx,.md,.txt"
                        label="Drop your voice profile here, or click to browse"
                        hint="Accepts .docx and .md"
                        fileName={voiceFileName}
                        onFile={handleVoiceFile}
                        onClear={clearVoice}
                        extracting={extracting}
                        error={fileError}
                        T={T}
                      />
                      {!voiceFileName && !voiceLoading && (
                        <div style={{ marginTop: 16, textAlign: "right" }}>
                          <button
                            onClick={skipVoice}
                            style={{
                              background: "none", border: "none", color: T.textMuted, cursor: "pointer",
                              fontSize: 13, fontFamily: T.font, textDecoration: "underline",
                            }}
                          >
                            Skip for now
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </Card>

                {/* Writing style summary — appears when it arrives */}
                <VoiceSummary
                  summary={voiceSummary}
                  loading={voiceLoading}
                  error={voiceError}
                  T={T}
                />

                {/* Advance as soon as voice text exists */}
                {voiceText && (
                  <div style={{ textAlign: "right" }}>
                    <Btn primary onClick={() => setSetupStep("ready")} T={T}>
                      Next {"\u2192"}
                    </Btn>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ── MAIN INPUT (after setup) ────────────────────────────── */}
        {isReady && step === "input" && (
          <div>
            {error && (
              <Card T={T} style={{ marginBottom: 16, borderColor: T.danger + "44" }}>
                <div style={{ color: T.danger, fontSize: 13 }}>{error}</div>
              </Card>
            )}

            {/* Resume profile across Meridian dimensions */}
            <ResumeProfile
              profile={profile}
              loading={profileLoading}
              error={profileError}
              discipline={discipline}
              getIntel={getIntel}
              T={T}
              collapsedByDefault={false}
            />

            {/* Auto-detected chips — only show when enough text */}
            {jobText.length > 50 && (
              <div style={{ display: "flex", gap: 10, marginBottom: 18, alignItems: "center" }}>
                <span style={{
                  padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600,
                  background: T.accentSoft, color: T.accentInk,
                  border: "1px solid " + T.accent + "33",
                }}>
                  {getIntel(discipline)?.label || "UX Research"}
                </span>
                <span style={{
                  padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 500,
                  background: T.bgInput, color: T.textSecondary,
                  border: "1px solid " + T.borderStrong,
                }}>
                  {seniority}
                </span>
                <span style={{ fontSize: 11, color: T.textDim }}>
                  Auto-detected from job description
                </span>
              </div>
            )}

            {jobText.length === 0 && (
              <div style={{ fontSize: 12, color: T.textMuted, marginBottom: 10, lineHeight: 1.6 }}>
                Paste a posting below to see how it compares against the live market and get a positioning strategy built from your resume and this specific role.
              </div>
            )}
            <SectionLabel T={T}>Job description</SectionLabel>
            <TextArea
              value={jobText} onChange={setJobText} T={T} rows={14}
              placeholder={"Paste the full job description here.\n\nTailor will identify the role\u2019s discipline, seniority level, and key requirements, then cross-reference them against current market data from Meridian."}
            />
            {jobText.length > 0 && (
              <div style={{ fontSize: 11, color: T.textDim, marginTop: 5 }}>
                {jobText.split(/\s+/).filter(Boolean).length} words
              </div>
            )}

            {/* Job vs. market analysis — shows as soon as job text is pasted */}
            {jobText.length > 150 && (
              <div style={{ marginTop: 20 }}>
                <JobVsMarket
                  jobDims={jobDims}
                  jobDimsLoading={jobDimsLoading}
                  jobDimsError={jobDimsError}
                  intel={getIntel(discipline)}
                  jobTextLength={jobText.length}
                  T={T}
                />
              </div>
            )}

            <div style={{ display: "flex", justifyContent: "center", flexDirection: "column", alignItems: "center", gap: 8, marginTop: 20 }}>
              <Btn primary onClick={analyze} disabled={!canAnalyze} T={T}>
                Analyze &amp; Tailor
              </Btn>
              {!canAnalyze && jobText.length > 0 && (
                <div style={{ fontSize: 12, color: T.textDim }}>
                  Add more content to continue
                </div>
              )}
            </div>
          </div>
        )}

        {/* LOADING */}
        {isReady && step === "loading" && <LoadingView discipline={discipline} intelLabel={getIntel(discipline)?.label} T={T} />}

        {/* RESULTS */}
        {isReady && step === "results" && results && (
          <div>
            {activeTab === "strategy" && <PositioningTab strategy={positioningStrategy} positionStrength={results.position_strength} talkingPoints={results.talking_points} rarityHook={rarityHook} responsibilityAlignment={responsibilityAlignment} intel={getIntel((profile && profile.discipline) || discipline)} T={T} />}
            {activeTab === "cover" && <CoverLetterTab coverLetter={results.cover_letter} onGenerate={generateCoverLetter} generating={coverGenerating} onRegenerate={regenerateCoverLetter} regenerating={regenerating} jobDims={jobDims} strategy={positioningStrategy} rarityHook={rarityHook} voiceSummary={voiceSummary} T={T} />}
            {activeTab === "resume" && <ResumeTab suggestions={results.suggestions} talkingPoints={results.talking_points} resumeText={resumeText} onReword={rewordSuggestion} rewordingIdx={rewordingIdx} atsResult={atsResult} customizations={resumeCustomizations} T={T} />}
            {activeTab === "market" && <MarketIntelTab discipline={discipline} seniority={seniority} jobText={jobText} jobDims={jobDims} jobDimsLoading={jobDimsLoading} jobDimsError={jobDimsError} intel={getIntel(discipline)} T={T} />}
          </div>
        )}
      </div>

      {/* ── FOOTER ──────────────────────────────────────────────────── */}
      <div style={{
        padding: "20px 24px", borderTop: "1px solid " + T.border,
        textAlign: "center", fontSize: 11, color: T.textDim, marginTop: 40,
      }}>
        Tailor {"\u00B7"} A Polite Robot tool {"\u00B7"} {"\u00A9"} {new Date().getFullYear()} Polite Robot
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Tailor />);

</script>
</body>
</html>
